# Test configuration: self-contained, no external environment required.
spring.datasource.url=jdbc:h2:mem:mams-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=defaultSecretKeyForDevelopmentOnlyChangeInProduction1234567890
jwt.expiration=86400000

cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.exposed-headers=
cors.allow-credentials=true
cors.max-age=3600

app.data-initializer.enabled=false
