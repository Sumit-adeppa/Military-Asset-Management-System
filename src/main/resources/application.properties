spring.application.name=Military-Asset-Management-System

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/military_asset_management_system
spring.datasource.username=postgres
spring.datasource.password=0123456789

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security / JWT
jwt.secret=defaultSecretKeyForDevelopmentOnlyChangeInProduction1234567890
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.exposed-headers=
cors.allow-credentials=true
cors.max-age=3600
